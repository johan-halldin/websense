services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: websense
    ports:
      - "5433:5432"
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d websense"]
      interval: 5s
      timeout: 5s
      retries: 10

  ingest:
    image: node:26-alpine
    restart: unless-stopped
    working_dir: /app
    volumes:
      - .:/app
    command: node apps/ingest/src/index.js
    environment:
      DATABASE_URL: postgres://postgres:postgres@timescaledb:5432/websense
      INGEST_INTERVAL_MS: "300000"
    depends_on:
      timescaledb:
        condition: service_healthy

volumes:
  timescaledb_data:
