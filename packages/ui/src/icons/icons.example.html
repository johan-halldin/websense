<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Icons</title>
    <link rel="stylesheet" href="../tokens.css" />
    <link rel="stylesheet" href="./icons.css" />
    <style>
      body {
        font-family: sans-serif;
        display: flex;
        flex-wrap: wrap;
        gap: 20px;
      }
      .item {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
        width: 80px;
      }
      .item .icon {
        --icon-scale: 1.5;
        --icon-color: var(--color-text);
      }
      .item span.name {
        font-size: 11px;
        font-family: monospace;
      }
    </style>
  </head>
  <body>
    <div class="item"><span class="icon arrow-right"></span><span class="name">arrow-right</span></div>
    <div class="item"><span class="icon check"></span><span class="name">check</span></div>
    <div class="item"><span class="icon close"></span><span class="name">close</span></div>
  </body>
</html>
