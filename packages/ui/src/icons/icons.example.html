<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Icons</title>
    <link rel="stylesheet" href="../tokens.css" />
    <link rel="stylesheet" href="./icons.css" />
    <style>
      body {
        font-family: sans-serif;
        display: flex;
        flex-wrap: wrap;
        gap: 20px;
      }
      .item {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
        width: 80px;
      }
      .item .icon {
        --icon-scale: 1.5;
        --icon-color: var(--color-text);
      }
      .item span.name {
        font-size: 11px;
        font-family: monospace;
        cursor: pointer;
        border-radius: 3px;
        padding: 1px 3px;
      }
      .item span.name:hover {
        background: var(--color-background);
      }
    </style>
  </head>
  <body>
    <div class="item"><span class="icon calendar"></span><span class="name" title="Click to copy">calendar</span></div>
    <div class="item"><span class="icon chevron-down"></span><span class="name" title="Click to copy">chevron-down</span></div>
    <div class="item"><span class="icon chevron-up"></span><span class="name" title="Click to copy">chevron-up</span></div>
    <div class="item"><span class="icon copy"></span><span class="name" title="Click to copy">copy</span></div>
    <div class="item"><span class="icon download"></span><span class="name" title="Click to copy">download</span></div>
    <div class="item"><span class="icon external-link"></span><span class="name" title="Click to copy">external-link</span></div>
    <div class="item"><span class="icon eye"></span><span class="name" title="Click to copy">eye</span></div>
    <div class="item"><span class="icon heart"></span><span class="name" title="Click to copy">heart</span></div>
    <div class="item"><span class="icon house"></span><span class="name" title="Click to copy">house</span></div>
    <div class="item"><span class="icon lock"></span><span class="name" title="Click to copy">lock</span></div>
    <div class="item"><span class="icon mail"></span><span class="name" title="Click to copy">mail</span></div>
    <div class="item"><span class="icon menu"></span><span class="name" title="Click to copy">menu</span></div>
    <div class="item"><span class="icon pencil"></span><span class="name" title="Click to copy">pencil</span></div>
    <div class="item"><span class="icon plus"></span><span class="name" title="Click to copy">plus</span></div>
    <div class="item"><span class="icon search"></span><span class="name" title="Click to copy">search</span></div>
    <div class="item"><span class="icon settings"></span><span class="name" title="Click to copy">settings</span></div>
    <div class="item"><span class="icon star"></span><span class="name" title="Click to copy">star</span></div>
    <div class="item"><span class="icon trash-2"></span><span class="name" title="Click to copy">trash-2</span></div>
    <div class="item"><span class="icon upload"></span><span class="name" title="Click to copy">upload</span></div>
    <div class="item"><span class="icon user"></span><span class="name" title="Click to copy">user</span></div>
    <script type="module">
      for (const label of document.querySelectorAll("span.name")) {
        label.addEventListener("click", async () => {
          await navigator.clipboard.writeText(label.textContent);
          const original = label.textContent;
          label.textContent = "Copied!";
          setTimeout(() => {
            label.textContent = original;
          }, 800);
        });
      }
    </script>
  </body>
</html>
