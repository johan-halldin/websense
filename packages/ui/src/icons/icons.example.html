<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Icons</title>
    <link rel="stylesheet" href="../tokens.css" />
    <link rel="stylesheet" href="./icons.css" />
    <style>
      body {
        font-family: sans-serif;
        display: flex;
        flex-wrap: wrap;
        gap: 20px;
      }
      .item {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
        width: 80px;
      }
      .item .icon {
        --icon-scale: 1.5;
        --icon-color: var(--color-text);
      }
      .item span.name {
        font-size: 11px;
        font-family: monospace;
      }
    </style>
  </head>
  <body>
    <div class="item">
      <span class="icon arrow-right"></span
      ><span class="name">arrow-right</span>
    </div>
    <div class="item">
      <span class="icon calendar"></span><span class="name">calendar</span>
    </div>
    <div class="item">
      <span class="icon check"></span><span class="name">check</span>
    </div>
    <div class="item">
      <span class="icon chevron-down"></span
      ><span class="name">chevron-down</span>
    </div>
    <div class="item">
      <span class="icon chevron-up"></span><span class="name">chevron-up</span>
    </div>
    <div class="item">
      <span class="icon close"></span><span class="name">close</span>
    </div>
    <div class="item">
      <span class="icon copy"></span><span class="name">copy</span>
    </div>
    <div class="item">
      <span class="icon download"></span><span class="name">download</span>
    </div>
    <div class="item">
      <span class="icon external-link"></span
      ><span class="name">external-link</span>
    </div>
    <div class="item">
      <span class="icon eye"></span><span class="name">eye</span>
    </div>
    <div class="item">
      <span class="icon heart"></span><span class="name">heart</span>
    </div>
    <div class="item">
      <span class="icon house"></span><span class="name">house</span>
    </div>
    <div class="item">
      <span class="icon lock"></span><span class="name">lock</span>
    </div>
    <div class="item">
      <span class="icon mail"></span><span class="name">mail</span>
    </div>
    <div class="item">
      <span class="icon menu"></span><span class="name">menu</span>
    </div>
    <div class="item">
      <span class="icon pencil"></span><span class="name">pencil</span>
    </div>
    <div class="item">
      <span class="icon plus"></span><span class="name">plus</span>
    </div>
    <div class="item">
      <span class="icon search"></span><span class="name">search</span>
    </div>
    <div class="item">
      <span class="icon settings"></span><span class="name">settings</span>
    </div>
    <div class="item">
      <span class="icon star"></span><span class="name">star</span>
    </div>
    <div class="item">
      <span class="icon trash-2"></span><span class="name">trash-2</span>
    </div>
    <div class="item">
      <span class="icon upload"></span><span class="name">upload</span>
    </div>
    <div class="item">
      <span class="icon user"></span><span class="name">user</span>
    </div>
  </body>
</html>
