<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>ws-button example</title>
    <link rel="stylesheet" href="./tokens.css" />
    <style>
      body {
        display: flex;
        flex-direction: column;
        gap: 20px;
        font-family: sans-serif;
      }
      .group {
        display: flex;
        flex-direction: row;
        gap: 10px;
        align-items: center;
      }
      /*
        A consuming app themes ws-button by redeclaring the same custom
        properties tokens.css defines - no JS API needed, just CSS cascade.
      */
      .custom-theme {
        --color-border: #d6409f;
        --color-border-hover: #a30662;
        --color-text: #a30662;
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "@lit/reactive-element": "../node_modules/@lit/reactive-element/reactive-element.js",
          "lit": "../node_modules/lit/index.js",
          "lit-element": "../node_modules/lit-element/index.js",
          "lit-element/": "../node_modules/lit-element/",
          "lit-html": "../node_modules/lit-html/lit-html.js",
          "lit-html/": "../node_modules/lit-html/"
        }
      }
    </script>
    <script type="module">
      import { init_example_button } from "./button.example.js";

      init_example_button(document.getElementById("default-root"));
      init_example_button(document.getElementById("custom-root"));
    </script>
  </head>
  <body>
    <div>
      <h3>Default theme (tokens.css)</h3>
      <div id="default-root" class="group"></div>
    </div>
    <div class="custom-theme">
      <h3>Custom theme (overridden --color-border / --color-text)</h3>
      <div id="custom-root" class="group"></div>
    </div>
  </body>
</html>
